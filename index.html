<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TapTapCard</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="profile-card">

    <!-- Cover -->
    <div class="cover">
      <img id="coverImage" src="" alt="Cover">
    </div>

    <!-- Profile picture -->
    <div class="profile-picture">
      <img id="profileImage" src="" alt="Profile">
    </div>

    <!-- Name -->
    <h1 id="name">Nom du profil</h1>

    <!-- Description -->
    <p id="description"></p>

    <!-- Social media -->
    <div id="socialLinks" class="social-links"></div>

    <!-- Contact buttons -->
    <div class="contact-buttons">

      <!-- WhatsApp -->
      <a id="whatsappButton"
         class="contact-button"
         href="#"
         target="_blank"
         rel="noopener noreferrer">

        <span class="contact-icon whatsapp-icon">
          <img src="https://cdn.simpleicons.org/whatsapp/FFFFFF"
               alt="WhatsApp">
        </span>

        <span>WhatsApp</span>

      </a>


      <!-- Phone -->
      <a id="phoneButton"
         class="contact-button"
         href="#">

        <span class="contact-icon phone-icon">
          <span>☎</span>
        </span>

        <span>Appeler</span>

      </a>


      <!-- Google Maps -->
      <a id="mapsButton"
         class="contact-button maps-button"
         href="#"
         target="_blank"
         rel="noopener noreferrer">

        <span class="contact-icon maps-icon">
          <img src="https://cdn.simpleicons.org/googlemaps"
               alt="Google Maps">
        </span>

        <span>Google Maps</span>

        <span class="arrow">›</span>

      </a>

    </div>

    <!-- Footer -->
    <div class="footer">
      <span>Merci pour votre visite</span>
      <span class="heart">♥</span>
      <div class="footer">
  <span>Produit par</span>
  <a href="https://www.instagram.com/naqra.nfc?stkn=MXU1bzEzM2hrODYzZg==" target="_blank" rel="noopener noreferrer">
    NAQRA
  </a>
      </div>
    </div>

  </main>

  <script src="app.js"></script>

</body>

</html>
